<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>ソライロMusic</title>

<style>
:root {
  --bg: #090914;
  --panel: #131222;
  --panel-hover: #21172f;
  --purple: #a855f7;
  --pink: #f472e8;
  --blue: #7dd3fc;
  --text: #f8f7ff;
  --muted: #a5a0bc;
  --line: #302641;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 0%, #25123c 0%, transparent 48%),
    var(--bg);
  font-family: Arial, "Hiragino Kaku Gothic ProN",
    "Noto Sans JP", sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--pink);
  outline-offset: 4px;
}

.hidden {
  display: none !important;
}

.page {
  width: min(100% - 32px, 920px);
  margin: 0 auto;
  padding: 35px 0 65px;
}

.eyebrow {
  color: var(--pink);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
}

.muted {
  color: var(--muted);
}

/* トップページ */

#home {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  text-align: center;
  overflow: hidden;
}

.home-inner {
  width: min(100%, 650px);
  padding: 35px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.home-eyebrow {
  position: relative;
  z-index: 2;
  margin: 0 0 34px;
  color: var(--pink);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
  line-height: 1.8;
}

.home-symbol {
  position: relative;
  z-index: 1;
  width: 104px;
  height: 104px;
  flex-shrink: 0;
  margin: 0 auto 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #b66bff88;
  border-radius: 32px;
  background: linear-gradient(145deg, #302044, #121426);
  color: var(--pink);
  font-size: 55px;
  box-shadow: 0 0 50px #a855f722;
  animation: float 4s ease-in-out infinite;
}

.home-title {
  position: relative;
  z-index: 2;
  width: 100%;
  margin: 0;
  font-size: clamp(39px, 9vw, 72px);
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.home-title .sky {
  color: var(--blue);
}

.home-title .music {
  color: var(--pink);
}

.home-description {
  margin: 24px 0 35px;
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
}

.home-button {
  padding: 16px 32px;
  border: 1px solid #d879ff;
  border-radius: 9px;
  color: white;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1.5px;
  background: linear-gradient(135deg, #7c3aed, #c026d3);
  box-shadow: 0 0 30px #a855f744;
  transition: transform .2s, box-shadow .2s;
}

.home-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 40px #d946ef66;
}

.home-footer {
  margin-top: 48px;
  color: #69617f;
  font-size: 10px;
  letter-spacing: 3px;
  line-height: 1.8;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-7px);
  }
}

/* ライブラリ */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 30px;
}

.header h1 {
  margin: 8px 0;
  font-size: clamp(28px, 6vw, 43px);
  letter-spacing: -1px;
}

.header-description {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.header-symbol {
  color: var(--pink);
  font-size: 48px;
  text-shadow: 0 0 25px #d946ef55;
}

.library-tools {
  margin: 24px 0 16px;
}

.search-input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
  color: white;
}

.search-input::placeholder {
  color: #77718f;
}

.track-count {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 12px;
}

.track-list {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #0e0d18;
}

.track-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px;
  color: var(--text);
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 1px solid #272035;
  transition: background .2s;
}

.track-row:last-child {
  border-bottom: 0;
}

.track-row:hover,
.track-row.selected {
  background: var(--panel-hover);
}

.track-number {
  width: 34px;
  flex-shrink: 0;
  color: #817895;
  font-size: 12px;
  text-align: center;
}

.track-art {
  width: 55px;
  height: 55px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 8px;
  background: linear-gradient(135deg, #302044, #171426);
  color: var(--pink);
  font-size: 25px;
}

.track-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.track-info {
  flex: 1;
  min-width: 0;
}

.track-title {
  display: block;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.track-subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
}

.track-action {
  flex-shrink: 0;
  color: var(--pink);
  font-size: 21px;
}

.empty-message {
  padding: 35px 15px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

/* 楽曲ページ */

.detail-top {
  margin-bottom: 25px;
}

.text-button {
  padding: 9px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}

.text-button:hover {
  color: white;
}

.player {
  padding: 23px;
  border: 1px solid #49315f;
  border-radius: 14px;
  background:
    radial-gradient(ellipse at top right, #4a1d5c44, transparent 60%),
    var(--panel);
}

.player-heading {
  display: flex;
  align-items: center;
  gap: 17px;
}

.player-art {
  width: 115px;
  height: 115px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 11px;
  background: linear-gradient(135deg, #39204c, #151324);
  color: var(--pink);
  font-size: 45px;
}

.player-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.player-title {
  margin: 8px 0;
  font-size: clamp(19px, 4vw, 27px);
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.player-subtitle {
  color: var(--muted);
  font-size: 12px;
}

audio {
  display: block;
  width: 100%;
  margin-top: 22px;
}

.lyrics-toggle {
  width: 100%;
  margin-top: 15px;
  padding: 13px;
  border: 1px solid #49315f;
  border-radius: 8px;
  color: white;
  background: #1b1428;
}

.lyrics-toggle:hover {
  background: #30203e;
}

.lyrics {
  margin-top: 18px;
  padding: 23px 14px;
  border-radius: 9px;
  background: #0b0a13;
  text-align: center;
}

.lyrics-heading {
  margin: 0 0 25px;
  color: var(--pink);
  font-size: 12px;
  letter-spacing: 3px;
}

.lyric-section {
  margin: 25px 0;
}

.lyric-section h3 {
  margin: 0 0 11px;
  color: #c084fc;
  font-size: 11px;
  letter-spacing: 2px;
}

.lyric-section p {
  margin: 0;
  font-size: 13px;
  line-height: 2;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.detail-footer {
  margin-top: 22px;
  text-align: center;
  color: #69617f;
  font-size: 10px;
  letter-spacing: 2px;
}

/* スマホ表示 */

@media (max-width: 520px) {
  #home {
    padding: 25px 18px;
  }

  .home-inner {
    padding: 28px 5px;
  }

  .home-eyebrow {
    margin-bottom: 30px;
    font-size: 10px;
    letter-spacing: 2px;
  }

  .home-symbol {
    width: 84px;
    height: 84px;
    margin-bottom: 27px;
    border-radius: 25px;
    font-size: 44px;
  }

  .home-title {
    font-size: clamp(35px, 9vw, 48px);
    letter-spacing: -1px;
    line-height: 1.35;
  }

  .home-description {
    margin-top: 21px;
    margin-bottom: 30px;
  }

  .home-footer {
    margin-top: 40px;
    font-size: 9px;
    letter-spacing: 2px;
  }

  .page {
    width: calc(100% - 24px);
    padding-top: 24px;
  }

  .track-row {
    gap: 9px;
    padding: 12px 8px;
  }

  .track-number {
    width: 27px;
  }

  .track-art {
    width: 46px;
    height: 46px;
  }

  .track-title {
    font-size: 12px;
  }

  .player {
    padding: 15px;
  }

  .player-art {
    width: 88px;
    height: 88px;
  }
}
</style>
</head>

<!-- 1. ソライロMusicのトップ -->

/* ページ切り替え */

const home = document.getElementById("home");
const library = document.getElementById("library");
const songPage = document.getElementById("songPage");

function showPage(page) {
  home.classList.add("hidden");
  library.classList.add("hidden");
  songPage.classList.add("hidden");

  page.classList.remove("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

document.getElementById("openLibrary").addEventListener("click", () => {
  showPage(library);
});

document.getElementById("homeFromLibrary").addEventListener("click", () => {
  showPage(home);
});

document.getElementById("backToLibrary").addEventListener("click", () => {
  document.getElementById("audioPlayer").pause();
  showPage(library);
});


/* 曲リスト */

const trackList = document.getElementById("trackList");
const trackCount = document.getElementById("trackCount");
const searchInput = document.getElementById("searchInput");

let selectedTrackIndex = null;

function renderTrackList() {
  const keyword = searchInput.value.trim().toLowerCase();

  const filteredTracks = tracks
    .map((track, index) => ({ track, index }))
    .filter(item =>
      item.track.title.toLowerCase().includes(keyword)
    );

  trackCount.textContent =
    `${filteredTracks.length} TRACK${filteredTracks.length === 1 ? "" : "S"}`;

  trackList.replaceChildren();

  if (filteredTracks.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-message";
    empty.textContent = "曲が見つかりませんでした。";
    trackList.appendChild(empty);
    return;
  }

  filteredTracks.forEach(({ track, index }) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "track-row";

    if (selectedTrackIndex === index) {
      button.classList.add("selected");
    }

    const number = document.createElement("span");
    number.className = "track-number";
    number.textContent = String(index + 1).padStart(3, "0");

    const art = document.createElement("span");
    art.className = "track-art";

    if (track.cover) {
      const image = document.createElement("img");
      image.src = track.cover;
      image.alt = "";

      image.onerror = () => {
        art.replaceChildren();
        art.textContent = "♫";
      };

      art.appendChild(image);
    } else {
      art.textContent = "♫";
    }

    const info = document.createElement("span");
    info.className = "track-info";

    const title = document.createElement("span");
    title.className = "track-title";
    title.textContent = track.title;

    const subtitle = document.createElement("div");
    subtitle.className = "track-subtitle";
    subtitle.textContent = track.subtitle || "ORIGINAL SONG";

    info.append(title, subtitle);

    const action = document.createElement("span");
    action.className = "track-action";
    action.textContent = selectedTrackIndex === index ? "●" : "▶";

    button.append(number, art, info, action);

    button.addEventListener("click", () => {
      selectTrack(index);
    });

    trackList.appendChild(button);
  });
}


/* 曲を選ぶ */

const playerArt = document.getElementById("playerArt");
const playerNumber = document.getElementById("playerNumber");
const playerTitle = document.getElementById("playerTitle");
const playerSubtitle = document.getElementById("playerSubtitle");
const audioPlayer = document.getElementById("audioPlayer");

const lyricsToggle = document.getElementById("lyricsToggle");
const lyricsBox = document.getElementById("lyrics");
const lyricsContent = document.getElementById("lyricsContent");

function selectTrack(index) {
  const track = tracks[index];

  selectedTrackIndex = index;

  playerNumber.textContent =
    `TRACK ${String(index + 1).padStart(3, "0")}`;

  playerTitle.textContent = track.title;
  playerSubtitle.textContent = track.subtitle || "ORIGINAL SONG";

  playerArt.replaceChildren();

  if (track.cover) {
    const image = document.createElement("img");
    image.src = track.cover;
    image.alt = `${track.title}のジャケット`;

    image.onerror = () => {
      playerArt.replaceChildren();
      playerArt.textContent = "♫";
    };

    playerArt.appendChild(image);
  } else {
    playerArt.textContent = "♫";
  }

  audioPlayer.pause();
  audioPlayer.src = track.audio;
  audioPlayer.load();

  lyricsBox.classList.add("hidden");
  lyricsToggle.textContent = "＋ 歌詞を見る";
  lyricsToggle.setAttribute("aria-expanded", "false");

  renderLyrics(track.lyrics || []);
  renderTrackList();

  showPage(songPage);
}


/* 歌詞 */

function renderLyrics(sections) {
  lyricsContent.replaceChildren();

  if (sections.length === 0) {
    const message = document.createElement("p");
    message.className = "muted";
    message.textContent = "この曲の歌詞はまだ登録されていません。";
    lyricsContent.appendChild(message);
    return;
  }

  sections.forEach(section => {
    const container = document.createElement("section");
    container.className = "lyric-section";

    const heading = document.createElement("h3");
    heading.textContent = section.section;

    const text = document.createElement("p");
    text.textContent = section.text;

    container.append(heading, text);
    lyricsContent.appendChild(container);
  });
}

lyricsToggle.addEventListener("click", () => {
  const willOpen = lyricsBox.classList.contains("hidden");

  lyricsBox.classList.toggle("hidden", !willOpen);

  lyricsToggle.textContent = willOpen
    ? "－ 歌詞を閉じる"
    : "＋ 歌詞を見る";

  lyricsToggle.setAttribute("aria-expanded", String(willOpen));
});


/* 検索 */

searchInput.addEventListener("input", renderTrackList);


/* 初期表示 */

renderTrackList();
</script>

</body>
</html>
